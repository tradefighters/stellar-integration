[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tradefighters/stellar-integration"

[workspace.dependencies]
# Pinned to the SDK line matching the protocol live on testnet and mainnet
# (protocol 29, checked 2026-10-25). See docs/SOROBAN-SETUP.md.
soroban-sdk = "29.0.1"

# Release profile recommended by `stellar contract init`: small, deterministic
# WASM with overflow checks kept on (checked math is part of the security model).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Same as release but keeps `log!` output, for local debugging only.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
